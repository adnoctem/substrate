# ref: https://github.com/pre-commit/pre-commit/issues/1930
# default_language_version:
#   ruby: 3.2.1
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=crlf]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        exclude: ^(CHANGELOG\.md$|docs/commands/)
        args:
          - "-c"
          - ".github/linters/.markdown-lint.yml"

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      # Run the linter.
      - id: zizmor
        args:
          - "-c"
          - ".github/linters/zizmor.yaml"

  - repo: https://github.com/crate-ci/typos
    rev: v1.50.2
    hooks:
      - id: typos
        exclude: (.*\.yaml|^CHANGELOG.md$)
        args:
          - "--config"
          - ".github/linters/.typos.toml"

  # Local hooks use the same MSBuild targets as CI.
  - repo: local
    hooks:
      - id: prettier-check
        name: Markdown format check
        entry: bun run check
        language: system
        pass_filenames: false
        types: [markdown]

      - id: powershell-check
        name: PowerShell format and analysis
        entry: dotnet msbuild tools/tasks.proj -t:CheckPowerShell -nologo
        language: system
        pass_filenames: false
        files: '\.(ps1|psm1|psd1)$'

      - id: csharp-format-check
        name: C# format check
        entry: dotnet msbuild tools/tasks.proj -t:CheckManaged -nologo
        language: system
        pass_filenames: false
        files: '\.(cs|csproj|slnx|props|targets|proj)$'
