name: "Testing"

on:
  workflow_dispatch:
  push:
    branches: [main, next, MVProwess/v2]
  pull_request:
    branches: [main, next, MVProwess/v2]

permissions: {}

defaults:
  run:
    shell: pwsh

concurrency:
  group: "${{ github.workflow }}@${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"

jobs:
  lint:
    name: Lint
    runs-on: windows-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Initialize dependencies
        shell: pwsh
        run: .\PSFoundation.ps1 init

      - name: Check formatting
        shell: pwsh
        run: .\PSFoundation.ps1 format -Check

      - name: Lint
        shell: pwsh
        run: .\PSFoundation.ps1 lint

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.shell }})
    needs: [lint]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    strategy:
      matrix:
        os: [windows-latest, windows-2022]
        shell: [powershell, pwsh]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Dump pre-existing module state
        run: |
          . .\src\maintenance.ps1
          Get-PSModule -Path ./.github/ci-modules-before.json

      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          global-json-file: global.json

      - name: Initialize dependencies
        run: .\PSFoundation.ps1 init

      - name: Dump post-init module state
        run: |
          . .\src\maintenance.ps1
          Get-PSModule -Path ./.github/ci-modules-after.json

      - name: Format check
        run: .\PSFoundation.ps1 format -Check

      - name: Lint
        run: .\PSFoundation.ps1 lint

      - name: Capture pinned v1 reference
        run: .\PSFoundation.ps1 baseline

      - name: Build staged module
        run: .\PSFoundation.ps1 build -Format Zip

      - name: Check C# formatting
        run: .\PSFoundation.ps1 format -Managed -Check

      - name: Test C# services
        run: .\PSFoundation.ps1 test -Managed

      - name: Test
        run: .\PSFoundation.ps1 test -Coverage -OutputDirectory build/test-results

      - name: Upload test and coverage reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-${{ matrix.os }}-${{ matrix.shell }}
          path: build/test-results/**
          if-no-files-found: warn
          retention-days: 14
